# ssh-browser settings: copy to ~/.config/ssh-browser/config and fill in.
# A shell file: the script sources it.

# The ssh host (a name from ~/.ssh/config) that can reach the private sites.
SSH_HOST=office

# What the Herdr status bar calls it.
LABEL="Office browser"

# Domains that go through the tunnel, each with its subdomains (space-separated).
DOMAINS="corp.example.com intranet.example"

# Subnets for hosts given by IP, as address/mask (space-separated).
SUBNETS="10.0.0.0/255.0.0.0"

# A private page that answers only through the tunnel: the status bar shows "no access" when it doesn't.
PROBE_URL="https://wiki.corp.example.com"

# Where everything else goes, in PAC syntax: "DIRECT", or a local proxy first: "PROXY 127.0.0.1:8080; DIRECT".
FALLBACK="DIRECT"

# Local SOCKS port and the Chrome profile folder (under ~/Library/Application Support/Google/).
PORT=1081
PROFILE="Chrome-office"
